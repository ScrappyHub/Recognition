name: release-gate

# Proves every push: packet law + prove-all (crypto, vault, event/identity/history/
# chain-anchor, attestation, signed SoftwareID) + publish scan + browser build.
# All verification is deterministic and offline; the passphrase below only drives the
# self-contained selftests (which set up and tear down ephemeral vaults).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Ensure real OpenSSH ssh-keygen is first on PATH
        shell: pwsh
        run: |
          # Get-Command otherwise resolves the Windows App-Execution-Alias stub, which
          # throws when started with redirected stdio (breaks attestation + SoftwareID).
          $osdir = Join-Path $env:SystemRoot 'System32\OpenSSH'
          $exe = Join-Path $osdir 'ssh-keygen.exe'
          if (-not (Test-Path $exe)) {
            $git = Join-Path $env:ProgramFiles 'Git\usr\bin'
            if (Test-Path (Join-Path $git 'ssh-keygen.exe')) { $osdir = $git; $exe = Join-Path $git 'ssh-keygen.exe' }
          }
          if (-not (Test-Path $exe)) { throw "no real ssh-keygen.exe found on runner" }
          Add-Content -Path $env:GITHUB_PATH -Value $osdir   # prepended for later steps
          Write-Host "ssh-keygen -> $exe"
          & $exe -h 2>&1 | Select-Object -First 1

      - name: Run the strict release gate
        shell: pwsh
        env:
          RECOGNITION_PASSPHRASE: ci-selftest-passphrase
        run: |
          $o = & pwsh -File scripts/RUN_RELEASE_GATE_V1.ps1 -RepoRoot . -RequireBrowserBuild *>&1 | Out-String
          Write-Host $o
          if ($o -notmatch 'RECOGNITION_RELEASE_GATE_V1_OK') {
            Write-Host '================ prove-all per-component detail (diagnostic) ================'
            & pwsh -File scripts/recognition_prove_all_v1.ps1 -RepoRoot .
            throw 'RELEASE GATE NOT GREEN'
          }
          Write-Host 'RECOGNITION_RELEASE_GATE_V1_OK confirmed by CI' -ForegroundColor Green
